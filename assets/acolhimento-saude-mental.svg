<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Acolhimento em um momento difícil</title>
  <desc id="desc">Duas pessoas sentadas juntas em um banco, uma oferecendo apoio à outra, perto de uma janela ensolarada e de plantas.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5e8d7"/>
      <stop offset="1" stop-color="#e4eee5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5cf8f"/>
      <stop offset="1" stop-color="#e8ad79"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" rx="38" fill="url(#wall)"/>
  <circle cx="538" cy="154" r="102" fill="url(#sun)" opacity=".82"/>
